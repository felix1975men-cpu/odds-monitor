name: NFL totals

on:
  schedule:
    # Ежедневно: скрипт кредитов Odds API не тратит, а в дни без матчей
    # в окне просто выходит. Раньше стояло 3,4,6,0,1 — по пятницам
    # тотал-метод не приходил вовсе, как и контекст.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Окно поиска матчей в часах"
        required: false
        default: "120"
      per_line:
        description: "Знаков в строке (20 или 30)"
        required: false
        default: "20"

jobs:
  totals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: NFL totals
        env:
          TG_TOKEN:     ${{ secrets.TG_TOKEN_NFL }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          WINDOW_HOURS: ${{ inputs.window || '120' }}
          PER_LINE:     ${{ inputs.per_line || '20' }}
        run: python nfl_totals.py
