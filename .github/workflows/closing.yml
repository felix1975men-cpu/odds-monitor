name: Closing line trigger

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Своя группа, отдельно от odds-commit.
# 12 сентября закрытия оборвались после 19:50 UTC и не сняли семь
# вечерних матчей плюс Chicago Cubs - Pittsburgh из дыры 17:09-18:42:
# в очереди группы GitHub держит только ОДИН ожидающий запуск, и
# каждый следующий запрос вытеснял ожидающее закрытие. При кроне раз
# в 15 минут эта работа попадает под вытеснение чаще всех остальных.
# CLV по тем пикам потерян навсегда — закрытие снимается только в
# окне перед матчем и задним числом не восстанавливается.
concurrency:
  group: odds-closing
  cancel-in-progress: false

jobs:
  closing:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        sport: [nfl, nba, nhl, mlb]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check window and snapshot if due
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOKEN: ${{ secrets[format('TG_TOKEN_{0}', matrix.sport)] }}
          SPORT: ${{ matrix.sport }}
          MODE: closing
        run: python odds_monitor.py

      - name: Commit data
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "${{ matrix.sport }} closing $(date -u +%Y-%m-%dT%H:%MZ)"
          # Пять попыток с растущей паузой: закрытия теперь пушат
          # параллельно со снапшотами и результатами.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" >&2
          exit 1
