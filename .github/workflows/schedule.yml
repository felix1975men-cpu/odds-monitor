name: Schedule

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

jobs:
  schedule:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        sport: [nfl, nba, nhl, mlb]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send slate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOKEN: ${{ secrets[format('TG_TOKEN_{0}', matrix.sport)] }}
          SPORT: ${{ matrix.sport }}
        run: python schedule.py
