name: Schedule

on:
  schedule:
    - cron: "30 8 * * *"   # 08:30 UTC — за полчаса до сводки
  workflow_dispatch:

jobs:
  schedule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sport: [mlb, nfl, nba, nhl]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send slate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SPORT: ${{ matrix.sport }}
        run: python schedule.py
