name: Closing loop (all sports)

# Файл называется nhl-closing.yml по истории, но цикл обслуживает ВСЕ лиги:
# nfl, nba, nhl, mlb. Название внутри — то, что видно в Actions.
#
# Вместо крона каждые 5 минут одна долгая задача раз в минуту спрашивает
# бесплатный /events по каждой лиге и снимает закрытие, когда до старта
# остаётся 8-20 минут. Расписания GitHub опаздывают на часы; такой цикл
# от опоздания старта не зависит.
#
# С 2 октября этот же цикл служит планировщиком утренних воркфлоу:
# GitHub сам выпускает их события на 6 часов позже. Каждую минуту цикл
# сверяется с таблицей слотов SLOTS и запускает нужный воркфлоу через
# gh workflow run, если после времени слота такого прогона ещё не было.

on:
  schedule:
    # Страховка на случай, если цепочка оборвётся. Сама цепочка держится
    # на самозапуске в конце каждого прогона (последний шаг).
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Своя группа, НЕ odds-commit: долгий прогон держит группу часами и
# заблокировал бы плановые снимки. Записи в csv сводятся через
# .gitattributes (merge=union), поэтому параллельные пуши не конфликтуют.
concurrency:
  group: nhl-closing-loop
  cancel-in-progress: false

jobs:
  closing:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Closing loop
        id: loop
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOKEN_NFL: ${{ secrets.TG_TOKEN_NFL }}
          TG_TOKEN_NBA: ${{ secrets.TG_TOKEN_NBA }}
          TG_TOKEN_NHL: ${{ secrets.TG_TOKEN_NHL }}
          TG_TOKEN_MLB: ${{ secrets.TG_TOKEN_MLB }}
          GH_TOKEN: ${{ github.token }}
          MODE: closing
          CLOSE_MIN: "8"
          CLOSE_MAX: "20"
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          END=$(( $(date +%s) + 20400 ))
          echo "loop until $(date -u -d @${END} +%H:%MZ)"

          # Таблица слотов, всё в UTC: файл, час, минута, дни недели (0=вс).
          SLOTS="snapshots.yml 07 08 *
          snapshots.yml 15 08 *
          snapshots.yml 21 08 *
          results.yml 08 06 *
          schedule.yml 08 26 *
          context.yml 08 33 *
          nhl-context.yml 08 37 *
          nfl-context.yml 08 41 *
          digest.yml 09 03 *
          nhl-digest.yml 09 07 *
          nfl-digest.yml 09 12 3,4,6,0,1
          totals.yml 10 03 *
          nhl-totals.yml 10 07 *
          nfl-totals.yml 10 12 *"

          run_slots() {
            NOWM=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
            TODAY=$(date -u +%Y-%m-%d)
            DOW=$(date -u +%w)
            while read -r F HH MM DAYS; do
              [ -z "$F" ] && continue
              case "$DAYS" in
                '*') ;;
                *) case ",$DAYS," in *",$DOW,"*) ;; *) continue ;; esac ;;
              esac
              SLOTM=$(( 10#$HH * 60 + 10#$MM ))
              [ "$NOWM" -ge "$SLOTM" ] || continue
              [ "$NOWM" -lt $(( SLOTM + 180 )) ] || continue
              KEY="$TODAY:$F:$HH$MM"
              grep -qx "$KEY" /tmp/sched_done 2>/dev/null && continue
              SINCE="${TODAY}T${HH}:${MM}:00Z"
              N=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${F}/runs" \
                    -f created=">=${SINCE}" -f per_page=1 --jq '.total_count' 2>/dev/null || echo "")
              if [ -z "$N" ]; then
                echo "[sched] api failed for $F"
                continue
              fi
              if [ "$N" -eq 0 ]; then
                if gh workflow run "$F" --ref "$BRANCH"; then
                  echo "[sched] launched $F (slot ${HH}:${MM}Z)"
                else
                  echo "[sched] launch failed for $F"
                  continue
                fi
              else
                echo "[sched] $F already ran since ${SINCE}"
              fi
              echo "$KEY" >> /tmp/sched_done
            done <<< "$SLOTS"
          }

          while [ "$(date +%s)" -lt "$END" ]; do
            git pull -q --rebase --autostash origin "$BRANCH" || { git rebase --abort 2>/dev/null || true; echo "pull failed"; }
            run_slots || true
            for S in nfl nba nhl mlb; do
              case "$S" in
                nfl) T="$TG_TOKEN_NFL" ;;
                nba) T="$TG_TOKEN_NBA" ;;
                nhl) T="$TG_TOKEN_NHL" ;;
                mlb) T="$TG_TOKEN_MLB" ;;
              esac
              SPORT="$S" TG_TOKEN="$T" python odds_monitor.py 2>&1 | sed "s/^/[$S] /"
            done
            if [ -n "$(git status --porcelain data/)" ]; then
              git add data/
              git commit -q -m "closing $(date -u +%Y-%m-%dT%H:%MZ)" || true
            fi
            AHEAD=$(git rev-list --count "origin/${BRANCH}..HEAD" 2>/dev/null || echo 0)
            if [ "$AHEAD" -gt 0 ]; then
              for i in 1 2 3 4 5; do
                if git pull -q --rebase --autostash origin "$BRANCH" && git push -q origin "HEAD:${BRANCH}"; then
                  echo "pushed on attempt $i"
                  break
                fi
                git rebase --abort 2>/dev/null || true
                sleep $((i * 5))
              done
            fi
            sleep 60
          done
          echo "finished=true" >> "$GITHUB_OUTPUT"

      - name: Start next loop
        if: steps.loop.outputs.finished == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nhl-closing.yml --ref "${GITHUB_REF_NAME}"
