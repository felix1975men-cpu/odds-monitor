name: NFL context

on:
  schedule:
    - cron: "35 8 * * *"
  workflow_dispatch:

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: NFL context
        env:
          TG_TOKEN:   ${{ secrets.TG_TOKEN_NFL }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python nfl_context.py
