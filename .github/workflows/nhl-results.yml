name: NHL results

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-commit
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Results and line movement
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN_NHL }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python nhl_results.py

      - name: Commit data
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "nhl results marker $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
