name: Daily results

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-commit
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        sport: [nfl, nba, nhl, mlb]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOKEN: ${{ secrets[format('TG_TOKEN_{0}', matrix.sport)] }}
          SPORT: ${{ matrix.sport }}
        run: python results.py

      - name: Commit results
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "${{ matrix.sport }} results $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
