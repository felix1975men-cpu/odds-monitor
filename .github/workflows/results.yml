name: Daily results

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Своя группа, отдельно от odds-commit.
# В очереди группы GitHub держит только ОДИН ожидающий запуск: пока
# результаты ждали снапшоты, следующий запрос в ту же группу вытеснил
# их с сообщением "Canceling since a higher priority waiting request
# exists" — 13 сентября так пропал весь блок результатов и движения
# линий. Гонка за push с другими воркфлоу закрывается циклом
# pull --rebase ниже, а не общей очередью.
concurrency:
  group: odds-results
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        sport: [nfl, nba, nhl, mlb]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOKEN: ${{ secrets[format('TG_TOKEN_{0}', matrix.sport)] }}
          SPORT: ${{ matrix.sport }}
        run: python results.py

      - name: Line movement
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOKEN: ${{ secrets[format('TG_TOKEN_{0}', matrix.sport)] }}
          SPORT: ${{ matrix.sport }}
        run: python movement.py

      - name: Commit results
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "${{ matrix.sport }} results $(date -u +%Y-%m-%d)"
          # Пять попыток с растущей паузой: теперь результаты и снапшоты
          # могут пушить одновременно, и разойтись они должны здесь.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
