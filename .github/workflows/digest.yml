name: Round digest

on:
  schedule:
    - cron: "3 9 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        # nfl ушёл в nfl-digest.yml — общий digest.py не умеет
        # опираться на Pinnacle, когда её линия стоит на целом,
        # а моя ставка на .5, и молча отдаёт прочерк.
        #
        # nhl ушёл в nhl-digest.yml по другой причине: в хоккее книги
        # выставляют трёхисходный рынок с ничьей на основное время.
        # Общий digest.py считает его обычным ML и сравнивает с
        # двухисходным fair от Pinnacle — 29 сентября это дало
        # Ванкувер +33% и Каролину +23%, которых не существует.
        sport: [nba, mlb]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send digest
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOKEN: ${{ secrets[format('TG_TOKEN_{0}', matrix.sport)] }}
          SPORT: ${{ matrix.sport }}
        run: python digest.py
