name: NHL digest

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Odds digest
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN_NHL }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python nhl_digest.py
