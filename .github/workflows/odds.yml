name: NFL Odds Monitor

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    - cron: "0 22 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TG_TOKEN:     ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          SPORT:        americanfootball_nfl
        run: python main.py

      - name: Commit data
        run: |
          git config user.name  "odds-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "snapshot $(date -u +%F_%H:%M)"
          git push
