name: NBA totals

# Запуск из цикла-планировщика (слот 10:17 UTC) и вручную.
# Крона нет намеренно: GitHub опаздывает на часы, расписанием управляет цикл.

on:
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Окно тура в часах (30 по умолчанию)"
        required: false
        default: "30"

jobs:
  totals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Totals method rows
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN_NBA }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WINDOW_H: ${{ github.event.inputs.window_hours || '30' }}
        run: python nba_totals.py
