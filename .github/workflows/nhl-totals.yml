name: NHL totals

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  totals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Totals method rows
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN_NHL }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python nhl_totals.py
